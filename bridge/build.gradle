plugins {
	id 'net.fabricmc.fabric-loom'
}

base {
	archivesName = 'j2b-bridge'
}

repositories {
	maven {
		name = 'Nucleoid'
		url = 'https://maven.nucleoid.xyz/'
	}
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Polymer does the vanilla-client translation. The bundle has every module
	// (core, blocks, resource pack, autohost, virtual entities).
	implementation "eu.pb4:polymer-bundled:${project.polymer_version}"
}

// Server-side stand-ins for the few client classes a block entity renderer needs. They carry
// the client classes' names so a mod's renderer links against them. See render/ModRenderers.
sourceSets.main.java.srcDir 'src/shim/java'

loom {
	runs {
		server {
			runDir = '../run'
		}
	}
}

processResources {
	def version = project.version
	inputs.property 'version', version

	filesMatching('fabric.mod.json') {
		expand 'version': version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
